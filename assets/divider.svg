      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="0.3" stop-color="#38bdf8"/>
      <stop offset="0.6" stop-color="#f59e0b"/>
      <stop offset="0.85" stop-color="#fb7185"/>
