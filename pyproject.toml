[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "beaconforge"
version = "0.1.0"
description = "Project-scoped deployment and incident metrics with durable event ingestion"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "fastapi==0.142.2",
  "uvicorn==0.54.0",
  "SQLAlchemy==2.1.2",
  "psycopg[binary]==3.3.6",
  "celery==5.6.3",
  "httpx==0.28.1",
  "pydantic-settings==2.15.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1", "pytest-cov==7.1.0", "ruff==0.16.10", "mypy==2.4.0",
  "bandit==1.9.4", "pip-audit==2.10.1", "cyclonedx-bom==7.5.0",
  "schemathesis==4.29.0", "openapi-spec-validator==0.9.0", "celery-types==0.26.0",
]

[project.scripts]
beaconforge = "beaconforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
beaconforge = ["py.typed"]

[tool.setuptools.data-files]
"share/beaconforge" = ["api/openapi.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=beaconforge --cov-report=term-missing --cov-fail-under=85"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]